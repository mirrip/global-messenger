<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Global Messenger</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#121824">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='12' fill='%232aabee'/><path d='M17.5 7.5L5.5 12.2l3.4 1.3 1.3 4.1 2.3-2.1 3.5 2.6L18 7.3z' fill='%23ffffff'/></svg>">
</head>
<body class="dark-theme">
  <div id="app">
    <!-- AUTH SCREEN -->
    <div id="auth-screen" class="auth-wrapper">
      <div class="auth-card">
        <div class="brand">
          <div class="brand-logo">🌐</div>
          <h1>Global Messenger</h1>
          <p class="subtitle">Бессерверный мессенджер нового поколения</p>
        </div>

        <div class="auth-tabs">
          <button id="tab-login" class="tab-btn active">Вход</button>
          <button id="tab-register" class="tab-btn">Регистрация</button>
        </div>

        <form id="auth-form" class="auth-form">
          <div class="input-group">
            <label for="auth-username">Имя пользователя</label>
            <input type="text" id="auth-username" placeholder="@username" required autocomplete="username">
          </div>

          <div class="input-group">
            <label for="auth-password">Пароль</label>
            <input type="password" id="auth-password" placeholder="••••••••" required autocomplete="current-password">
          </div>

          <button type="submit" id="auth-submit-btn" class="btn primary-btn full-width">
            Войти в систему
          </button>
        </form>

        <div id="auth-status" class="status-msg"></div>

        <div class="cloud-info">
          <span>⚡ Sharded Google Sheets + CacheService</span>
          <span>📁 Файлы до 1 ТБ через Google Drive</span>
        </div>
      </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="main-screen" class="main-wrapper hidden">
      <!-- RESTORED ORIGINAL SIDEBAR -->
      <aside class="sidebar">
        <header class="sidebar-header">
          <div class="user-profile">
            <div class="avatar" id="current-user-avatar">?</div>
            <div class="user-meta">
              <div class="name" id="current-user-name">Загрузка...</div>
              <div class="status-badge online">В сети</div>
            </div>
          </div>
          <div class="header-actions">
            <button id="btn-new-chat" class="icon-btn" title="Новый диалог">💬</button>
            <button id="btn-logout" class="icon-btn" title="Выйти">🚪</button>
          </div>
        </header>

        <div class="search-box">
          <input type="text" id="chat-search" placeholder="Поиск диалогов или @пользователей...">
        </div>

        <div class="chat-list" id="chat-list">
          <div class="chat-item active" data-chat-id="dm:general">
            <div class="avatar general-avatar">🌐</div>
            <div class="chat-item-meta">
              <div class="chat-item-top">
                <span class="chat-title">Общий чат</span>
                <span class="chat-time" id="general-last-time">17:15</span>
              </div>
              <div class="chat-preview" id="general-last-msg">Нажмите, чтобы начать общение</div>
            </div>
          </div>
        </div>
      </aside>

      <!-- AUTHENTIC TELEGRAM INNER CHAT VIEW -->
      <main class="chat-view">
        <!-- CHAT HEADER -->
        <header class="chat-header">
          <button id="btn-back" class="icon-btn mobile-only">←</button>
          <div class="chat-header-info">
            <div class="chat-header-avatar" id="active-chat-avatar">🌐</div>
            <div class="chat-header-text">
              <h2 id="active-chat-title">Общий чат</h2>
              <span class="chat-status" id="active-chat-status">в сети</span>
            </div>
          </div>
          <div class="chat-header-actions">
            <span class="badge-tag success">RAM Cache (150ms)</span>
          </div>
        </header>

        <!-- TELEGRAM MESSAGES HISTORY CONTAINER -->
        <div class="messages-container" id="messages-container">
          <div class="tg-date-bubble">Сегодня</div>
          <div class="msg-feed" id="messages-feed"></div>
        </div>

        <!-- UPLOAD PROGRESS OVERLAY -->
        <div id="upload-progress-card" class="upload-progress-card hidden">
          <div class="upload-info">
            <div class="upload-icon">📦</div>
            <div class="upload-details">
              <div class="upload-name" id="upload-file-name">file.apk</div>
              <div class="upload-stats" id="upload-file-stats">0 MB / 0 MB (0%)</div>
            </div>
            <button id="upload-cancel-btn" class="icon-btn small">✕</button>
          </div>
          <div class="progress-bar-track">
            <div class="progress-bar-fill" id="upload-progress-fill" style="width: 0%"></div>
          </div>
        </div>

        <!-- TELEGRAM COMPOSER INPUT BAR -->
        <footer class="tg-composer">
          <input type="file" id="file-input" style="display: none">
          
          <!-- Attachment Clip Icon -->
          <button id="btn-attach" class="tg-clip-btn" title="Прикрепить файл (до 1 ТБ)">
            <svg viewBox="0 0 24 24" width="24" height="24">
              <path fill="currentColor" d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5a2.5 2.5 0 0 1 5 0v10.5c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5V6H9v9.5a3 3 0 0 0 6 0V5a4 4 0 0 0-8 0v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/>
            </svg>
          </button>

          <!-- Input Textarea Pill -->
          <div class="tg-input-pill">
            <textarea id="message-input" placeholder="Написать сообщение..." rows="1"></textarea>
            <button id="btn-emoji" class="tg-emoji-btn" title="Смайлики">
              <svg viewBox="0 0 24 24" width="22" height="22">
                <path fill="currentColor" d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/>
              </svg>
            </button>
          </div>

          <!-- Telegram Blue Round Send Button with Paper Airplane -->
          <button id="btn-send" class="tg-airplane-btn" title="Отправить">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </footer>
      </main>
    </div>
  </div>

  <!-- LIGHTBOX MODAL FOR IMAGES -->
  <div id="lightbox-modal" class="lightbox-modal hidden">
    <div class="lightbox-backdrop"></div>
    <div class="lightbox-content">
      <div class="lightbox-header">
        <span id="lightbox-title" class="lightbox-title">Просмотр фото</span>
        <div class="lightbox-actions">
          <button id="lightbox-download-btn" class="btn-lightbox" title="Скачать">
            <svg viewBox="0 0 24 24" width="16" height="16" style="vertical-align:middle; margin-right:4px;"><path fill="currentColor" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>Скачать
          </button>
          <button id="lightbox-close-btn" class="btn-lightbox close-btn" title="Закрыть">✕</button>
        </div>
      </div>
      <div class="lightbox-body">
        <img id="lightbox-img" src="" alt="Full view">
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
